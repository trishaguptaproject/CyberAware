
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7ed">
  <title>Survey Submitted | CyberAware</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #fff7ed;
      color: #263244;
    }

    .card {
      width: 100%;
      max-width: 600px;
      padding: 42px 28px;
      background: white;
      border: 1px solid #fed7aa;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(50, 40, 25, 0.08);
    }

    .check {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #ffedd5;
      color: #ea580c;
      font-size: 38px;
    }

    h1 { margin: 0 0 14px; }
    p { color: #64748b; line-height: 1.7; }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 13px 22px;
      border-radius: 10px;
      background: #ea580c;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover { background: #c2410c; }
  </style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Thank You!</h1>
    <p>Your Cyber Awareness Survey has been submitted.</p>
    <p>Your feedback helps promote safer internet habits in our community.</p>
    <a href="/">Return to CyberAware</a>
  </main>
</body>
</html>
